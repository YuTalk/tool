# 最后修改：2026-11-24 01:01
# 哔哩哔哩 · 纯净
# 做法按经过验证的公开模块：推荐流过滤广告卡片、「我的」页 sections_v2、底部栏 tab 接口、视频页广告用 protobuf 脚本
# 带开关：在 Egern 模块编辑页里，想关哪个功能就关哪个；去广告的 4 个（开屏、推荐、评论、空降）合成一个总开关
# 注意：模块里没有不经过开关的拦截，关掉总开关广告就全回来
# 用法：Egern > 工具 > 模块 > + > 粘贴 raw 链接
# 注意：不要和别的哔哩哔哩模块同时开（比如 fmz200 的），两个都改同一批接口会打架，开关看起来就像没用
name: 哔哩哔哩 · 纯净
description: 一个干净的哔哩哔哩：一键去广告，净化评论区，「我的」页只留你想留的
author: YuTalk
homepage: https://github.com/YuTalk/tool
icon: https://raw.githubusercontent.com/YuTalk/tool/main/icon/bilibili.png
compat_arguments:
  removeAds: true
  removeHotWords: true
  cleanMinePage: true
  displayUpList: show
compat_arguments_schema:
  removeAds:
    name: '[去广告]总开关'
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  removeHotWords:
    name: '[搜索]去除热词'
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cleanMinePage:
    name: '[我的]精简多余入口'
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  displayUpList:
    name: '[动态]最常访问（显示/隐藏/自动）'
    default_value: show
    options:
    - show
    - hide
    - auto
compat_arguments_desc: '[去广告]总开关（开屏、推荐、评论、空降）

[搜索]去除热词

[我的]精简多余入口

[动态]最常访问（显示/隐藏/自动）'
scriptings:
- http_response:
    name: Bilibili AdBlock
    script_url: https://raw.githubusercontent.com/YuTalk/tool/main/script/bilibili.js
    timeout: 10
    match: ^https?://(app|api|grpc)\.bili(bili\.com|api\.net)/(bilibili\.app\.interface\.v1\.Search/DefaultWords|x/v2/(splash/|account/mine|dm/ad|search/square|feed/index(/story)?)|x/resource/(top/activity|patch/tab|show/tab/v2)|x/vip/ads/materials|pgc/activity/deliver/material/receive)
    body_required: true
    env:
      argument: '{"removeAds":{{{removeAds}}},"removeHotWords":{{{removeHotWords}}},"cleanMinePage":{{{cleanMinePage}}}}'
- http_request:
    name: bilibili.protobuf.request
    script_url: https://egern.pages.dev/scripts/kokoryh/Sparkle/dist/bilibili.protobuf.request.js
    timeout: 10
    match: ^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(app\.viewunite\.v1\.View\/View|main\.community\.reply\.v1\.Reply\/MainList)$
    body_required: true
    binary_body: true
    env:
      _hub_enabled: 'true'
      argument: '{"purifyComment":true,"logLevel":"error"}'
- http_response:
    name: bilibili.protobuf.response
    script_url: https://egern.pages.dev/scripts/kokoryh/Sparkle/dist/bilibili.protobuf.response.js
    timeout: 20
    match: ^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(app\.(show\.v1\.Popular\/Index|dynamic\.v2\.Dynamic\/DynAll|view(unite)?\.v1\.View\/(View|ViewProgress|RelatesFeed|AIRelateAsync)|playurl\.v1\.PlayURL\/PlayView|playerunite\.v1\.Player\/PlayViewUnite)|polymer\.app\.search\.v1\.Search\/SearchAll|community\.service\.dm\.v1\.DM\/DmView|main\.community\.reply\.v1\.Reply\/MainList|pgc\.gateway\.player\.v2\.PlayURL\/PlayView)$
    body_required: true
    binary_body: true
    env:
      argument: '{"displayUpList":"{{{displayUpList}}}","purifyComment":{{{removeAds}}},"sponsorBlock":{{{removeAds}}},"logLevel":"error"}'
      EGH_DEVICE_TYPE: iPhone
mitm:
  hostnames:
    includes:
    - app.bilibili.com
    - api.bilibili.com
    - app.biliapi.net
    - grpc.bilibili.com
    - grpc.biliapi.net
