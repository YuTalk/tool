# 最后修改：2026-11-23 23:26
# 哔哩哔哩去广告 · 精简版（自己写的模块，不引用别人的模块）
# 之前完整版把 B站的接口拦错了导致首页加载失败，先只留最稳的两条
# 等首页正常了，再一条一条加回去
# 用法：Egern > 工具 > 模块 > + > 粘贴 raw 链接
# 注意：不要和别的哔哩哔哩模块同时开
name: 哔哩哔哩去广告
description: 去开屏广告、搜索热词
author: YuTalk
homepage: https://github.com/YuTalk/tool
url_rewrites:
# 开屏广告，直接拒绝
- match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/splash\/(brand\/list|event\/list2|list|show)(\?.*)?$
  location: http://reject/
  status_code: 307
# 搜索框下面的热词推荐，直接拒绝
- match: ^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.interface\.v1\.Search\/DefaultWords$
  location: http://reject/
  status_code: 307
mitm:
  hostnames:
    includes:
    - app.bilibili.com
    - app.biliapi.net
    - grpc.bilibili.com
    - grpc.biliapi.net
