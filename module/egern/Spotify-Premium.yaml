# 最后修改：2026-11-24 02:07
# Spotify 会员
# 改编自 Reukix 的 Spotify Premium v2026.11.16.1，脚本都由我们自己维护，放在仓库 script/ 文件夹里，不直接引用别人家的链接
# 原模块：https://raw.githubusercontent.com/Reukix/ukix/refs/heads/main/Script/Spotify.sgmodule
# 做法：会员走 protobuf 脚本，首页/搜索去广告，歌词补全+翻译；开关只管歌词，不去广告没有总开关，会员和去广告永远开着
# 用法：Egern > 工具 > 模块 > + > 粘贴 raw 链接
name: Spotify 会员
description: 会员配置、首页与播放页去广告，歌词补全和双语翻译
author: YuTalk
homepage: https://github.com/YuTalk/tool
icon: https://raw.githubusercontent.com/YuTalk/tool/main/icon/spotify.png
compat_arguments:
  Lyrics: true
  Translate: true
  TargetLanguage: zh-CN
compat_arguments_schema:
  Lyrics:
    name: '[歌词]启用歌词补全'
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  Translate:
    name: '[歌词]启用歌词翻译'
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  TargetLanguage:
    name: '[歌词]翻译目标语言'
    default_value: zh-CN
    options:
    - zh-CN
    - zh-TW
    - en
    - ja
    - ko
    - es
    - fr
compat_arguments_desc: '[歌词]启用歌词补全

[歌词]启用歌词翻译

[歌词]翻译目标语言'
header_rewrites:
- delete:
    type: request
    match: ^https:\/\/(?:[A-Za-z0-9-]+-)?spclient(?:\.wg)?\.spotify\.com(?::443)?\/(?:user-customization-service\/v1\/customize|nebula\/v1\/configuration\/attributes|remote-config-resolver\/v3\/configuration)\/?(?:\?[^#]*)?$
    name: if-none-match
url_rewrites:
- ^https:\/\/(spclient\.wg|.*-spclient)\.spotify\.com(:443)?\/pendragon 307 reject
- ^https:\/\/.*-spclient\.spotify\.com(:443)?\/pam-view-service\/ 307 reject
- ^https:\/\/.*37i9dQZF1EYkqdzj48dyYq 307 reject
map_locals:
- match: ^https:\/\/(.*-spclient\.spotify\.com(:443)?|spclient\.wg\.spotify\.com)\/gabo-receiver-service
  status_code: 200
  body: ''
  headers:
    Cache-Control: no-cache
    Content-Length: '0'
rules:
- domain:
    match: aet.spotify.com
    policy: REJECT
scriptings:
- http_response:
    name: spotify-home
    script_url: https://raw.githubusercontent.com/YuTalk/tool/main/script/spotify-home.js
    match: ^https:\/\/(?:[A-Za-z0-9-]+-)?spclient(?:\.wg)?\.spotify\.com(?::443)?\/casita\/v1\/home\/default\/?(?:\?[^#]*)?$
    body_required: true
    binary_body: true
- http_response:
    name: spotify-search
    script_url: https://raw.githubusercontent.com/YuTalk/tool/main/script/spotify-search.js
    match: ^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/browsita\/v.\/browse
    body_required: true
    binary_body: true
- http_response:
    name: spotify-scroll
    script_url: https://raw.githubusercontent.com/YuTalk/tool/main/script/spotify-lyrics.js
    match: ^https:\/\/(?:[A-Za-z0-9-]+-)?spclient(?:\.wg)?\.spotify\.com(?::443)?\/scrollsita\/v[0-9]+\/scroll\/spotify:[^?#]+(?:\?[^#]*)?$
    body_required: true
    binary_body: true
    env:
      argument: 'Lyrics={{{Lyrics}}}&Translate={{{Translate}}}&TargetLanguage={{{TargetLanguage}}}'
- http_response:
    name: spotify-lyrics
    script_url: https://raw.githubusercontent.com/YuTalk/tool/main/script/spotify-lyrics.js
    match: ^https:\/\/(?:[A-Za-z0-9-]+-)?spclient(?:\.wg)?\.spotify\.com(?::443)?\/color-lyrics\/v2\/track\/[A-Za-z0-9]{22}(?:\/image\/[^/?#]+)?\/?(?:\?[^#]*)?$
    body_required: true
    binary_body: true
    env:
      argument: 'Lyrics={{{Lyrics}}}&Translate={{{Translate}}}&TargetLanguage={{{TargetLanguage}}}'
- http_response:
    name: spotify-lyrics-metadata
    script_url: https://raw.githubusercontent.com/YuTalk/tool/main/script/spotify-lyrics.js
    match: ^https:\/\/(?:[A-Za-z0-9-]+-)?spclient(?:\.wg)?\.spotify\.com(?::443)?\/(?:extended-metadata\/v0\/extended-metadata|metadata\/4\/track\/[a-fA-F0-9]{32})(?:\?[^#]*)?$
    body_required: true
    binary_body: true
    env:
      argument: 'Lyrics={{{Lyrics}}}&Translate={{{Translate}}}&TargetLanguage={{{TargetLanguage}}}'
- http_response:
    name: spotify-lyrics-playback
    script_url: https://raw.githubusercontent.com/YuTalk/tool/main/script/spotify-lyrics.js
    match: ^https:\/\/(?:[A-Za-z0-9-]+-)?spclient(?:\.wg)?\.spotify\.com(?::443)?\/connect-state\/v1\/devices\/[^/?#]+(?:\?[^#]*)?$
    body_required: true
    binary_body: true
    env:
      argument: 'Lyrics={{{Lyrics}}}&Translate={{{Translate}}}&TargetLanguage={{{TargetLanguage}}}'
- http_response:
    name: spotify-proto
    script_url: https://raw.githubusercontent.com/YuTalk/tool/main/script/spotify-proto.js
    match: ^https:\/\/(?:[A-Za-z0-9-]+-)?spclient(?:\.wg)?\.spotify\.com(?::443)?\/(?:bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize|nebula\/v1\/configuration\/attributes|remote-config-resolver\/v3\/configuration)\/?(?:\?[^#]*)?$
    body_required: true
    binary_body: true
mitm:
  hostnames:
    includes:
    - '*.spotify.com'
