# YouTube Enhance
# 改编自 Maasea 的 Youtube (Music) Enhance：https://github.com/Maasea/sgmodule/raw/master/YouTube.Enhance.sgmodule
# 做法：拦截 youtubei 接口改界面（屏蔽上传、选段、Shorts 按钮）和字幕翻译，拦截 googlevideo 请求处理字幕
# 带开关：在 Egern 模块编辑页里，屏蔽哪个按钮、字幕翻译成哪种语言都能改
# 用法：Egern > 工具 > 模块 > + > 粘贴 raw 链接
# 注意：不要和别的 YouTube 模块同时开（比如 DualSubs），两个都改字幕会打架
# 注意：字幕翻译要先有原字幕，没有原字幕的视频翻译不了；翻译语言默认 off，改成 zh-CN 才会翻成中文
name: YouTube Enhance
description: 适用于 YouTube 与 YouTube Music：屏蔽上传、选段、Shorts 按钮，字幕翻译
author: YuTalk
homepage: https://github.com/YuTalk/tool
icon: https://raw.githubusercontent.com/YuTalk/tool/main/icon/youtube.png
compat_arguments:
  blockUpload: true
  blockImmersive: true
  blockShorts: false
  captionLang: 'off'
  debug: false
compat_arguments_schema:
  blockUpload:
    name: '[界面]屏蔽上传按钮'
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  blockImmersive:
    name: '[界面]屏蔽选段按钮'
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  blockShorts:
    name: '[界面]屏蔽 Shorts 按钮'
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  captionLang:
    name: '[字幕]翻译语言'
    default_value: 'off'
    options:
    - 'off'
    - zh-CN
    - zh-TW
    - en
    - ja
    - ko
  debug:
    name: '[调试]启用调试模式'
    default_value: 'false'
    options:
    - 'true'
    - 'false'
compat_arguments_desc: '[界面]屏蔽上传按钮

[界面]屏蔽选段按钮

[界面]屏蔽 Shorts 按钮

[字幕]翻译语言（off 是关闭，改成 zh-CN 翻成中文）

[调试]启用调试模式'
scriptings:
- http_response:
    name: youtube.response
    script_url: https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js
    match: ^https?:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config))(\?(.*))?$
    body_required: true
    binary_body: true
    env:
      argument: '{"captionLang":"{{{captionLang}}}","blockUpload":{{{blockUpload}}},"blockImmersive":{{{blockImmersive}}},"blockShorts":{{{blockShorts}}},"debug":{{{debug}}}}'
- http_request:
    name: youtube.request.init
    script_url: https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js
    match: ^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*
    body_required: true
    binary_body: true
    env:
      argument: '{"captionLang":"{{{captionLang}}}"}'
- http_request:
    name: youtube.request.log_event
    script_url: https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js
    match: ^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event
    body_required: true
    binary_body: true
mitm:
  hostnames:
    includes:
    - '*.googlevideo.com'
    - youtubei.googleapis.com
