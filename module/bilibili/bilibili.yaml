name: 哔哩哔哩
description: 拜托，没有广告的哔哩哔哩真的超酷的
author: 'kokoryh, kokoryh[https://github.com/kokoryh] · Egern adaptation: ErrBin'
homepage: https://github.com/kokoryh/Sparkle/blob/master/src/script/bilibili/README.md
icon: https://egern.pages.dev/assets/icons/fmz200/wool_scripts/Loon/plugin/split/partB/bilibili.webp
compat_arguments:
  displayUpList: show
  purifyComment: true
  optimizeRequest: true
  sponsorBlock: true
  logLevel: error
compat_arguments_schema:
  displayUpList:
    name: '[动态]中[最常访问]的显示方式'
    default_value: show
    options:
    - show
    - hide
    - auto
  purifyComment:
    name: '[评论区]过滤置顶评论广告'
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  optimizeRequest:
    name: 优化评论区加载
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  sponsorBlock:
    name: 空降助手
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  logLevel:
    name: 日志等级
    default_value: error
    options:
    - error
    - warn
    - info
    - debug
    - 'off'
compat_arguments_desc: '[动态]中[最常访问]的显示方式

  [评论区]过滤置顶评论广告

  优化评论区加载

  空降助手

  日志等级'
rules:
- domain:
    match: bsbsb.top
    policy: PROXY
- domain:
    match: dns.google
    policy: REJECT
- domain:
    match: api.biliapi.com
    policy: REJECT
- domain:
    match: app.biliapi.com
    policy: REJECT
- domain:
    match: api.biliapi.net
    policy: REJECT
- domain:
    match: app.biliapi.net
    policy: REJECT
- and:
    match:
    - domain_suffix:
        match: chat.bilibili.com
    - or:
        match:
        - domain_keyword:
            match: stun
        - domain_keyword:
            match: tracker
        - domain_keyword:
            match: p2p
    policy: REJECT
- dest_port:
    match: '4480'
    policy: REJECT-NO-DROP
- dest_port:
    match: '4483'
    policy: REJECT-NO-DROP
- dest_port:
    match: '9102'
    policy: REJECT-NO-DROP
rewrites:
- match: ^https:\/\/api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/line3-h5-mobile-api\.biligame\.com\/game\/live\/large_card_material\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"code":0,"message":"OK","ttl":1,"data":{"max_time":0,"min_interval":31536000,"pull_interval":31536000,"keep_ids":[],"show":[],"list":[{}],"splash_request_id":""}}'
- match: ^https:\/\/ap[ip]\.bilibili\.com\/x\/(resource\/(top\/activity|patch\/tab(\/v2)?)|v2\/search\/square|vip\/ads\/materials)\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"code":-404,"message":"-404","ttl":1,"data":null}'
- match: ^https:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}'
- match: ^(?:https://grpc\.biliapi\.net/bilibili\.app\.interface\.v1\.Teenagers/ModeStatus)$
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: text/plain
        grpc-status: '0'
      body:
        base64: AAAAABMKEQgCEgl0ZWVuYWdlcnMgAioA
- match: ^(?:https://grpc\.biliapi\.net/bilibili\.app\.interface\.v1\.Search/DefaultWords)$
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: text/plain
        grpc-status: '0'
      body:
        base64: AAAAACEaHeaQnOe0ouinhumikeOAgeeVquWJp+aIlnVw5Li7KAE=
- match: ^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.(view\.v1\.View\/TFInfo|viewunite\.v1\.View\/(PlayPause|ViewEndPage))$
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: text/plain
        grpc-status: '0'
      body:
        base64: AAAAAAA=
- match: ^http:\/\/[^?]+\/resolve\?host=(ap[ip]\.bilibili\.com|grpc\.biliapi\.net|api\.live\.bilibili\.com)
  actions:
  - response_body:
      jq: .dns[]? |= (.ips = [] | .ttl = 86400)
- match: ^https:\/\/api\.live\.bilibili\.com\/xlive\/open-interface\/v2\/tracker\/conf\?
  actions:
  - response_body:
      jq: .data.domains = ["wss://tracker.chat.bilibili.com"]
- match: ^https:\/\/api\.bilibili\.com\/x\/pd-proxy\/tracker\?
  actions:
  - response_body:
      jq: .data[][]? = "stun.chat.bilibili.com:3478"
- match: ^https:\/\/api\.bilibili\.com\/pgc\/view\/v2\/app\/season\?
  actions:
  - response_body:
      jq: del(.data.payment)
- match: ^https:\/\/api\.bilibili\.com\/pgc\/page\/channel\?
  actions:
  - response_body:
      jq: .data.modules |= map(select(.type != "TIP") | if .type == "BANNER" then .module_data.items |= map(select(.url
        | startswith("https://www.bilibili.com/blackboard/era/") | not)) else . end)
- match: ^https:\/\/app\.bilibili\.com\/x\/resource\/show\/skin\?
  actions:
  - response_body:
      jq: delpaths([["data", "common_equip"]])
- match: ^https:\/\/app\.bilibili\.com\/x\/resource\/show\/tab\/v2\?
  actions:
  - response_body:
      jq: ".data.tab = [\n    {\n        pos: 1,\n        id: 731,\n        name: \"直播\",\n        tab_id: \"直播tab\"\
