- match: ^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/(show|event\/list2)\?
  actions:
  - response_body:
      jq: .data |= with_entries(if .key | IN("show", "event_list") then .value = [] else . end)
- match: ^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index\?
  actions:
  - response_body:
      jq: if .data.items then .data.items |= map(select((.banner_item == null) and (.ad_info == null) and (.card_goto
        == "av") and (.card_type | IN("small_cover_v2", "large_cover_single_v9", "large_cover_v1")))) end
- match: ^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index\/story\?
  actions:
  - response_body:
      jq: if .data.items then .data.items |= map(select((.ad_info == null) and (.card_goto | IN("vertical_ad_av",
        "vertical_ad_live", "vertical_ad_picture") | not)) | del(.story_cart_icon, .free_flow_toast, .image_infos,
        .course_info, .game_info)) end
