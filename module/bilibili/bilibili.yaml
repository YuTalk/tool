      jq: '.data.vip |= if . != null and .status == 0 then . + { status: 1, type: 2, due_date: 9005270400000, role:
        15 } else . end'
scriptings:
- http_request:
    name: bilibili.protobuf.request
    script_url: https://egern.pages.dev/scripts/kokoryh/Sparkle/dist/bilibili.protobuf.request.js
    timeout: 10
    match: ^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(app\.viewunite\.v1\.View\/View|main\.community\.reply\.v1\.Reply\/MainList)$
    body_required: true
    binary_body: true
    env:
      _hub_enabled: '{{{optimizeRequest}}}'
      argument: '{"purifyComment":{{{purifyComment}}},"logLevel":"{{{logLevel}}}"}'
- http_request:
    name: bilibili.airborne
    script_url: https://egern.pages.dev/scripts/kokoryh/Sparkle/dist/bilibili.protobuf.request.js
    timeout: 10
    match: ^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(community\.service\.dm\.v1\.DM\/DmSegMobile|app\.view(unite)?\.v1\.View\/ViewProgress)$
    body_required: true
    binary_body: true
    env:
      _hub_enabled: '{{{sponsorBlock}}}'
      argument: '{"logLevel":"{{{logLevel}}}"}'
- http_response:
    name: bilibili.live
    script_url: https://egern.pages.dev/scripts/kokoryh/Sparkle/dist/bilibili.json.js
    timeout: 20
    match: ^https:\/\/api\.live\.bilibili\.com\/xlive\/(app-interface\/v2\/index\/feed|app-room\/v1\/index\/getInfoBy(Room|User))\?
    body_required: true
- http_response:
    name: bilibili.webpage
    script_url: https://egern.pages.dev/scripts/kokoryh/Sparkle/dist/webpage.bilibili.js
    timeout: 20
    match: ^https:\/\/www\.bilibili\.com\/blackboard\/era\/[^?]+\.html\?
    body_required: true
- http_response:
    name: bilibili.protobuf.response
    script_url: https://egern.pages.dev/scripts/kokoryh/Sparkle/dist/bilibili.protobuf.response.js
    timeout: 20
    match: ^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(app\.(show\.v1\.Popular\/Index|dynamic\.v2\.Dynamic\/DynAll|view(unite)?\.v1\.View\/(View|ViewProgress|RelatesFeed|AIRelateAsync)|playurl\.v1\.PlayURL\/PlayView|playerunite\.v1\.Player\/PlayViewUnite)|polymer\.app\.search\.v1\.Search\/SearchAll|community\.service\.dm\.v1\.DM\/DmView|main\.community\.reply\.v1\.Reply\/MainList|pgc\.gateway\.player\.v2\.PlayURL\/PlayView)$
    body_required: true
    binary_body: true
    env:
      argument: '{"displayUpList":"{{{displayUpList}}}","purifyComment":{{{purifyComment}}},"sponsorBlock":{{{sponsorBlock}}},"logLevel":"{{{logLevel}}}"}'
      EGH_DEVICE_TYPE: iPhone
mitm:
  hostnames:
    includes:
    - grpc.biliapi.net
    - app.bilibili.com
    - api.bilibili.com
    - api.live.bilibili.com
    - www.bilibili.com
    - line3-h5-mobile-api.biligame.com
    excludes: []
env_schema:
  EGH_DEVICE_TYPE:
    name: 设备类型
    description: 默认 iPhone；iPad / Mac 请按实际设备切换。用于原脚本的设备分类判断；待 Egern 提供原生设备类型接口后移除此临时参数。
    default_value: iPhone
    options:
    - iPhone
    - iPad
    - Mac
